# Prometheus Values Configuration

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

server:
  retention: 2d
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false

serverFiles:
  alerting_rules.yml:
    groups:
      - name: flask-error-rate
        interval: 1m
        rules:
          - alert: HTTP5xxErrorRateHigh
            expr: sum(rate(flask_http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(flask_http_request_duration_seconds_count[5m])) > 0.01
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Flask is returning more than 1% 5xx responses"
